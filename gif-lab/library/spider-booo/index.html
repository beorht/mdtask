<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Паук: Booo!!</title>
  <style>
    :root {
      --ink: #141414;
      --paper: #ffffff;
      --spider-w: clamp(200px, 36vw, 340px);
      --rest: 16vh;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Контейнер паука: появляется сверху в случайном месте, left задаёт JS */
    #rig {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--spider-w);
      transform: translateY(-150vh);
    }

    /* Паутина: висит от верхнего края до тела паука */
    #thread {
      position: absolute;
      left: 49.8%;
      top: -130vh;
      width: 2px;
      height: 130vh;
      background: var(--ink);
      transform: translateX(-1px);
    }

    /* Тело: качается на точке крепления нити, поэтому нить не отрывается */
    #body {
      position: relative;
      width: 100%;
      transform-origin: 50% 0;
    }

    #body img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Задние лапы: отдельные слои, крепятся к телу в точке сгиба */
    .leg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    #legL { transform-origin: 37.4% 60.8%; }
    #legR { transform-origin: 61.9% 61.6%; }

    /* Веки: чёрные, как тело паука, закрывают глаза при морганье */
    .lid {
      position: absolute;
      background: var(--ink);
      border-radius: 50%;
      transform: scaleY(0);
      transform-origin: 50% 0;
    }
    #lidL { left: 42.6%; top: 45.2%; width: 7.3%; height: 8.9%; }
    #lidR { left: 49.8%; top: 45.2%; width: 7.3%; height: 8.9%; }

    /* Облачко с текстом */
    #bubble {
      position: absolute;
      left: calc(70% + 7px);
      top: 30%;
      padding: 8px 14px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 18px;
      box-shadow: 3px 3px 0 var(--ink);
      font-weight: 800;
      font-size: clamp(16px, 2.2vw, 24px);
      color: var(--ink);
      white-space: nowrap;
      opacity: 0;
      transform: scale(0);
      transform-origin: 0 100%;
    }
    #bubble::before,
    #bubble::after {
      content: "";
      position: absolute;
      bottom: 12px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }
    #bubble::before {
      left: -13px;
      border-right: 13px solid var(--ink);
    }
    #bubble::after {
      left: -9px;
      border-right: 10px solid #fff;
      border-top-width: 6px;
      border-bottom-width: 6px;
    }

    /* Облачко слева, если паук ближе к правому краю */
    #bubble.flip {
      left: auto;
      right: calc(70% + 7px);
      transform-origin: 100% 100%;
    }
    #bubble.flip::before {
      left: auto;
      right: -13px;
      border-right: none;
      border-left: 13px solid var(--ink);
    }
    #bubble.flip::after {
      left: auto;
      right: -9px;
      border-right: none;
      border-left: 10px solid #fff;
    }

    #replay {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 10px 22px;
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #replay.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="rig">
      <div id="thread"></div>
      <div id="body">
        <img src="img/spider-body.png" alt="Паук">
        <img id="legL" class="leg" src="img/spider-leg-left.png" alt="">
        <img id="legR" class="leg" src="img/spider-leg-right.png" alt="">
        <div id="lidL" class="lid"></div>
        <div id="lidR" class="lid"></div>
        <div id="bubble">Booo!!</div>
      </div>
    </div>
    <button id="replay">Повторить</button>
  </div>

  <script>
    const rig = document.getElementById('rig');
    const thread = document.getElementById('thread');
    const body = document.getElementById('body');
    const lidL = document.getElementById('lidL');
    const lidR = document.getElementById('lidR');
    const legL = document.getElementById('legL');
    const legR = document.getElementById('legR');
    const bubble = document.getElementById('bubble');
    const replayBtn = document.getElementById('replay');

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // одно моргание: веко опускается и поднимается
    const blink = (lid) => lid.animate(
      [
        { transform: 'scaleY(0)' },
        { transform: 'scaleY(1)', offset: 0.5 },
        { transform: 'scaleY(0)' }
      ],
      { duration: 260, easing: 'ease-in-out' }
    ).finished;

    // случайная позиция по горизонтали при каждом запуске
    function pickPosition() {
      const vw = window.innerWidth;
      const w = rig.offsetWidth;
      const margin = 120;
      const x = vw > w + margin * 2
        ? margin + Math.random() * (vw - w - margin * 2)
        : (vw - w) / 2;
      rig.style.left = x + 'px';
      // если паук справа, облачко открываем влево
      bubble.classList.toggle('flip', x + w / 2 > vw / 2);
    }

    async function run() {
      pickPosition();

      // 1. Резкое падение сверху (ускорение, как под действием тяжести) с коротким отскоком
      await rig.animate(
        [
          { transform: 'translateY(-150vh)', easing: 'cubic-bezier(0.55, 0, 1, 0.45)' },
          { transform: 'translateY(calc(var(--rest) + 12px))', offset: 0.9, easing: 'ease-out' },
          { transform: 'translateY(var(--rest))' }
        ],
        { duration: 1200, fill: 'forwards' }
      ).finished;

      await wait(200);

      // 2. Моргает глазами по очереди: левый, правый, и так два раза
      for (let i = 0; i < 2; i++) {
        await blink(lidL);
        await wait(120);
        await blink(lidR);
        await wait(120);
      }

      // 3. Рядом появляется облачко с надписью
      await bubble.animate(
        [
          { opacity: 0, transform: 'scale(0)' },
          { opacity: 1, transform: 'scale(1.15)', offset: 0.7 },
          { opacity: 1, transform: 'scale(1)' }
        ],
        { duration: 350, easing: 'ease-out', fill: 'forwards' }
      ).finished;

      await wait(900);

      // 4. Смех: тело качается на нити и подпрыгивает.
      // Нить растягивается и сжимается вместе с телом, поэтому не отрывается.
      const bodyFrames = [
        { transform: 'translateY(0) rotate(0deg)' },
        { transform: 'translateY(-16px) rotate(-7deg)' },
        { transform: 'translateY(0) rotate(0deg)' },
        { transform: 'translateY(-16px) rotate(7deg)' },
        { transform: 'translateY(0) rotate(0deg)' }
      ];
      const threadFrames = [
        { height: '130vh' },
        { height: 'calc(130vh - 16px)' },
        { height: '130vh' },
        { height: 'calc(130vh - 16px)' },
        { height: '130vh' }
      ];
      const laughOpts = { duration: 450, iterations: 3, easing: 'ease-in-out' };
      await Promise.all([
        body.animate(bodyFrames, laughOpts).finished,
        thread.animate(threadFrames, laughOpts).finished
      ]);

      await wait(150);

      // 5. Уходит вверх, задние лапы подтягивают его: сгибаются к телу и снова тянутся
      bubble.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: 'forwards' });
      const climbLegs = { duration: 1000, easing: 'ease-in-out' };
      const pull = (from, to) => [
        { transform: 'rotate(0deg)' },
        { transform: `rotate(${from}deg)` },
        { transform: `rotate(${to}deg)` },
        { transform: `rotate(${from}deg)` },
        { transform: 'rotate(0deg)' }
      ];
      legL.animate(pull(-40, -8), climbLegs);
      legR.animate(pull(40, 8), climbLegs);
      await rig.animate(
        [
          { transform: 'translateY(var(--rest))' },
          { transform: 'translateY(-150vh)' }
        ],
        { duration: 1000, easing: 'cubic-bezier(0.5, 0, 0.9, 0.5)', fill: 'forwards' }
      ).finished;

      replayBtn.classList.add('show');
    }

    replayBtn.addEventListener('click', () => location.reload());

    run();
  </script>
</body>
</html>
