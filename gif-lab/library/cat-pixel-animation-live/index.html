<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кошка</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    /* Позиция и масштаб задаются transform. Точка отсчёта — низ (пол),
       поэтому при уменьшении и увеличении ноги остаются на месте. */
    #cat {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    #cat img {
      display: block;
      height: min(40vh, 230px);
      width: auto;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
    }

    #error {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      padding: 10px 12px;
      background: #fff3f3;
      color: #8a1d1d;
      border: 1px solid #c94a4a;
      border-radius: 8px;
      font: 14px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="cat"><img id="sprite" alt="Кошка"></div>
    <div id="error" hidden></div>
  </div>

  <script>
    // Данные: clips.json (кадры и клипы) и actions.json (действия). Код их не меняет.
    // Управление из кода: window.Cat.play('sleep') — поставить действие в очередь
    // (выполнится после текущего), window.Cat.actions(), window.Cat.clips(), window.Cat.queue().

    const sprite = document.getElementById('sprite');
    const cat = document.getElementById('cat');
    const errorBox = document.getElementById('error');
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const frameUrl = (f) => `frames/${f}.png`;

    let CLIPS = {};
    let CFG = null;
    const queue = [];   // очередь действий (объекты из actions.json)
    let pos = { x: 0, y: 0, s: 1 };
    let facing = 'right';

    function fail(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
      console.error(message);
    }

    // Проверка данных: опечатка в имени клипа должна быть видна сразу, а не во время показа
    function validate(clipsData, cfg) {
      const clips = clipsData.clips || {};
      const problems = [];
      for (const [name, clip] of Object.entries(clips)) {
        if (!Array.isArray(clip.frames) || clip.frames.length === 0) problems.push(`клип «${name}»: нет кадров`);
        if (!(clip.fps > 0)) problems.push(`клип «${name}»: fps должен быть больше 0`);
      }
      const check = (clipName, where) => {
        if (!clips[clipName]) problems.push(`${where}: нет клипа «${clipName}» в clips.json`);
      };
      for (const action of cfg.actions) {
        for (const step of action.steps) {
          if (step.clip) check(step.clip, `действие «${action.id}»`);
          else if (step.move !== 'random' && step.move !== 'exit') problems.push(`действие «${action.id}»: неизвестный шаг`);
        }
      }
      check(cfg.walk.right, 'walk.right');
      check(cfg.walk.left, 'walk.left');
      return problems;
    }

    // Предзагрузка кадров, чтобы смена не мигала
    function preload() {
      for (const clip of Object.values(CLIPS)) {
        for (const f of clip.frames) new Image().src = frameUrl(f);
      }
    }

    function toCss(p) {
      return `translate(${p.x}px, ${p.y}px) scale(${p.s})`;
    }

    function place(p) {
      cat.getAnimations().forEach((a) => a.cancel());
      pos = p;
      cat.style.transform = toCss(p);
    }

    // d: 0 — далеко (вверху, меньше), 1 — близко (внизу, больше)
    function atDepth(x, d) {
      const vh = window.innerHeight;
      const H = cat.offsetHeight;  // без transform: высота картинки
      const s = CFG.depth.farScale + (CFG.depth.nearScale - CFG.depth.farScale) * d;
      const ground = vh * (CFG.depth.farGround + (CFG.depth.nearGround - CFG.depth.farGround) * d);
      return { x, y: ground - H, s };
    }

    function randomSpot(offscreen) {
      const vw = window.innerWidth;
      const d = Math.random();
      // запас 1.3× на масштаб ближнего плана, чтобы за краем кошка была полностью невидна
      const margin = cat.offsetWidth * 1.3 + 30;
      const x = offscreen
        ? (Math.random() < 0.5 ? -margin : vw + 30)
        : rnd(0.05, 0.8) * vw;
      return atDepth(x, d);
    }

    // Клип, повторяющийся до stop(); используется и для держания позы, и для ходьбы
    function startLoop(name) {
      const clip = CLIPS[name];
      const interval = 1000 / clip.fps;
      let stopped = false;
      (async () => {
        let i = 0;
        while (!stopped) {
          sprite.src = frameUrl(clip.frames[i % clip.frames.length]);
          i++;
          await wait(interval);
        }
      })();
      return () => { stopped = true; };
    }

    // Выполнить клип: loop — держать ms миллисекунд; без loop — один проход
    async function runClip(name, ms) {
      const clip = CLIPS[name];
      if (!clip.loop) {
        for (const f of clip.frames) {
          sprite.src = frameUrl(f);
          await wait(1000 / clip.fps);
        }
        return;
      }
      const stop = startLoop(name);
      await wait(ms || 0);
      stop();
    }

    // Пройти в точку to: клип ходьбы по направлению, движение по transform
    async function walkTo(to) {
      const from = pos;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const dist = Math.hypot(dx, Math.abs(dy) * 0.6 + Math.abs(dx) * 0.4);
      if (dist < 2 && Math.abs(to.s - from.s) < 0.01) return;

      if (Math.abs(dx) > 4) facing = dx > 0 ? 'right' : 'left';
      const stop = startLoop(CFG.walk[facing]);
      const duration = Math.max(200, dist / CFG.walkSpeed);
      await cat.animate(
        [{ transform: toCss(from) }, { transform: toCss(to) }],
        { duration, easing: 'linear', fill: 'forwards' }
      ).finished;
      stop();
      place(to);
    }

    async function runStep(step) {
      if (step.move === 'random') return walkTo(randomSpot(false));
      if (step.move === 'exit') return walkTo(randomSpot(true));
      const ms = step.for ? rnd(step.for[0], step.for[1]) : undefined;
      return runClip(step.clip, ms);
    }

    async function runAction(action) {
      for (const step of action.steps) await runStep(step);
    }

    function pickAction() {
      const list = CFG.actions;
      const total = list.reduce((s, a) => s + (a.weight || 0), 0);
      let r = Math.random() * total;
      for (const a of list) {
        r -= a.weight || 0;
        if (r < 0) return a;
      }
      return list[0];
    }

    function findAction(id) {
      return CFG.actions.find((a) => a.id === id) || null;
    }

    // Один проход: входит с края, несколько действий, уходит за край
    async function pass() {
      place(randomSpot(true));
      await walkTo(randomSpot(false));

      const [min, max] = CFG.pass.actionCount;
      const count = Math.round(rnd(min, max));
      for (let i = 0; i < count; i++) {
        const action = queue.length ? queue.shift() : pickAction();
        await runAction(action);
        if (Math.random() < CFG.pass.wanderAfterAction) await walkTo(randomSpot(false));
      }

      await walkTo(randomSpot(true));
      await wait(rnd(2000, 4000));
      pass();
    }

    // Управление из кода
    window.Cat = {
      actions: () => CFG ? CFG.actions.map((a) => ({ id: a.id, label: a.label, weight: a.weight })) : [],
      clips: () => Object.keys(CLIPS),
      queue: () => queue.map((a) => a.id),
      play(id) {
        const action = findAction(id);
        if (!action) {
          console.warn(`Нет действия «${id}» в actions.json`);
          return false;
        }
        queue.push(action);
        return true;
      },
    };

    async function start() {
      const [clipsData, cfg] = await Promise.all([
        fetch('clips.json', { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('clips.json: ' + r.status); return r.json(); }),
        fetch('actions.json', { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('actions.json: ' + r.status); return r.json(); }),
      ]);
      const problems = validate(clipsData, cfg);
      if (problems.length) {
        fail('Ошибки в данных кошки:\n' + problems.join('\n'));
        return;
      }
      CLIPS = clipsData.clips;
      CFG = cfg;
      preload();
      // первый кадр — чтобы знать размер картинки до первого прохода
      sprite.src = frameUrl(CLIPS[CFG.walk.right].frames[0]);
      sprite.addEventListener('load', () => pass(), { once: true });
    }

    start().catch((err) => fail('Не удалось загрузить данные кошки: ' + err.message));
  </script>
</body>
</html>
