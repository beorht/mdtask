# Конфигурация службы libcat — электронный каталог и абонемент библиотеки
# УСТАРЕВШАЯ конфигурация (до переезда на новый сервер), служба её не читает

[server]
listen = 0.0.0.0
port = 8921
workers = 4

[database]
path = /srv/libcat/old/libcat-2024.db
backup_dir = /var/backups/libcat

[log]
access_log = /var/log/libcat/access.log
level = info
